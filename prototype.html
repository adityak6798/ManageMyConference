<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Greenroom — Product & Delivery Prototype</title>
  <style>
    :root {
      --ink:#17231d; --muted:#67736d; --line:#dfe6e1; --paper:#f6f8f5;
      --panel:#fff; --green:#145c3d; --green2:#237755; --mint:#d9f1e4;
      --gold:#f3b94f; --red:#bd4b40; --blue:#396d9e; --shadow:0 16px 45px rgba(18,42,31,.09);
    }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
    aside{position:sticky;top:0;height:100vh;background:#102c20;color:#d9e6de;padding:24px 16px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:11px;padding:0 8px 25px}.mark{width:36px;height:36px;background:var(--mint);color:#123b29;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:19px}.brand strong{display:block;color:white;font-size:15px}.brand span{font-size:11px;color:#9ab4a6}
    .event{margin:0 5px 20px;padding:12px;background:#173b2b;border:1px solid #28513e;border-radius:12px}.event small{color:#91ad9f}.event div{font-weight:700;color:white;margin-top:3px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#749181;padding:9px 12px}
    nav button{width:100%;border:0;background:transparent;color:#bdd0c5;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer;display:flex;align-items:center;gap:10px}nav button:hover,nav button.active{background:#28513d;color:#fff}nav i{font-style:normal;width:20px;text-align:center}
    .aside-bottom{margin-top:auto;border-top:1px solid #2b4939;padding-top:14px}.user{display:flex;gap:10px;align-items:center;padding:8px}.avatar{width:34px;height:34px;border-radius:50%;background:#dba84d;color:#2b2515;display:grid;place-items:center;font-weight:800}.user small{display:block;color:#88a596}
    main{min-width:0}.topbar{height:72px;padding:0 30px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
    .role-switch{display:flex;background:#edf1ed;padding:4px;border-radius:10px}.role-switch button{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:650}.role-switch button.active{background:white;color:var(--green);box-shadow:0 2px 8px #ccd5ce}
    .top-actions{display:flex;gap:9px;align-items:center}.search{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 12px;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:var(--ink);font-weight:650;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn:hover{transform:translateY(-1px)}
    .content{padding:30px;max-width:1440px;margin:auto}.prototype-notice{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;padding:10px 13px;border:1px solid #e2c77f;background:#fff8e7;color:#684b12;border-radius:10px;font-size:12px}.prototype-notice b{white-space:nowrap}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--green2);font-weight:800;font-size:10px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:23px}.heading h1{margin:5px 0 2px;font-size:29px;letter-spacing:-.035em}.heading p{margin:0;color:var(--muted);max-width:660px}
    .grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:17px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 10px rgba(25,47,36,.025);padding:18px}.stat .value{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0}.label{color:var(--muted);font-size:12px}.trend{font-size:11px;color:var(--green2);font-weight:700}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card h2{font-size:16px;margin:0}.card h3{font-size:13px;margin:0}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.link{color:var(--green2);font-size:12px;font-weight:700;cursor:pointer}
    .progress{height:7px;border-radius:8px;background:#e9eeea;overflow:hidden}.progress span{display:block;height:100%;background:var(--green2);border-radius:inherit}.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #edf0ee}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row strong{font-size:13px}.row small{color:var(--muted);display:block}.pill{padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#edf1ee;color:#506158;white-space:nowrap}.pill.green{background:var(--mint);color:var(--green)}.pill.gold{background:#fff0ce;color:#8a5a00}.pill.red{background:#fae2df;color:#93382f}.pill.blue{background:#e1edf7;color:#285d8a}
    .timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:18px 0}.stage{padding:12px 8px;background:#eef2ef;border-radius:8px;text-align:center;color:#68766f;font-size:11px}.stage.done{background:var(--mint);color:var(--green);font-weight:750}.stage.now{outline:2px solid var(--green);background:white;color:var(--green);font-weight:800}
    table{width:100%;border-collapse:collapse}th{text-transform:uppercase;letter-spacing:.08em;font-size:9px;color:#7c8882;text-align:left;padding:9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #edf0ee}tr:last-child td{border-bottom:0}.score{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:var(--mint);font-weight:800;color:var(--green)}
    .tabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--muted)}.tabs button.active{background:#183d2c;border-color:#183d2c;color:white}
    .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.column{background:#edf1ee;border-radius:12px;padding:11px;min-height:280px}.columnhead{display:flex;justify-content:space-between;font-weight:750;margin:2px 2px 10px}.person{background:white;border:1px solid #e0e6e2;border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 2px 5px rgba(20,40,30,.04)}.person small{color:var(--muted)}
    .agenda{display:grid;grid-template-columns:65px repeat(3,1fr);gap:7px}.time{padding-top:9px;color:var(--muted);font-size:11px}.session{border-left:4px solid var(--green2);background:#ecf6f0;padding:10px;border-radius:7px;min-height:70px}.session.gold{border-color:var(--gold);background:#fff6e4}.session.blue{border-color:var(--blue);background:#edf5fb}.session strong,.session small{display:block}.session small{color:var(--muted);margin-top:5px}
    .flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:18px 0}.node{border:1px solid #bfd1c6;background:white;border-radius:10px;padding:12px 15px;text-align:center;min-width:120px}.node strong{display:block}.node small{color:var(--muted)}.arrow{color:#79a18b;font-size:18px}.layer{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--line)}.layer:first-child{border-top:0}.layer b{color:var(--green)}.tags span{display:inline-block;background:#eff3f0;border-radius:7px;padding:6px 9px;margin:2px;font-size:11px}
    .check{display:flex;gap:11px;padding:10px 0;border-top:1px solid #edf0ee}.check:first-child{border-top:0}.checkmark{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--mint);color:var(--green);font-size:11px;font-weight:900}.checkmark.wait{background:#fff0ce;color:#895900}.meter{display:flex;align-items:center;gap:12px;margin:12px 0}.meter .progress{flex:1}.metric{min-width:34px;font-weight:800}
    .public-hero{background:linear-gradient(135deg,#123e2b,#1f7551);color:white;border-radius:20px;padding:45px;overflow:hidden;position:relative}.public-hero:after{content:"";position:absolute;width:280px;height:280px;border:60px solid rgba(255,255,255,.07);border-radius:50%;right:-80px;top:-110px}.public-hero h1{font-size:42px;line-height:1.05;max-width:650px;margin:12px 0}.public-hero p{color:#c5dbcf;max-width:550px}.public-hero .btn{margin-top:14px}.speaker-grid{grid-template-columns:repeat(4,1fr);margin-top:16px}.speaker{text-align:center}.portrait{height:145px;border-radius:11px;background:linear-gradient(145deg,#d7e9df,#86ae98);margin-bottom:12px;display:grid;place-items:center;font-size:40px}
    .empty{padding:50px;text-align:center;color:var(--muted)}.mobile{display:none}.toast{position:fixed;right:24px;bottom:24px;background:#173b2b;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:none}
    @media(max-width:950px){.app{grid-template-columns:76px 1fr}.brand div,.event,.navlabel,nav button span,.user div{display:none}aside{padding:20px 10px}.brand{padding-left:10px}nav button{justify-content:center}.stats,.three,.speaker-grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.app{display:block}aside{display:none}.content{padding:20px}.topbar{padding:0 16px}.search{display:none}.stats,.three,.speaker-grid,.kanban{grid-template-columns:1fr}.role-switch button{padding:6px;font-size:10px}.heading{align-items:flex-start}.heading .btn{display:none}.agenda{grid-template-columns:52px 1fr}.agenda .session:nth-child(4n){display:none}.public-hero{padding:28px}.public-hero h1{font-size:31px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark">G</div><div><strong>Greenroom</strong><span>Conference operations</span></div></div>
    <div class="event"><small>Current event</small><div>Future Forward 2027⌄</div></div>
    <div class="navlabel">Workspace</div>
    <nav id="nav"></nav>
    <div class="aside-bottom"><div class="user"><div class="avatar">ET</div><div><b>Event team</b><small>Organizer preview</small></div></div></div>
  </aside>
  <main>
    <header class="topbar">
      <div class="role-switch" id="roles"></div>
      <div class="top-actions"><div class="search">⌕ Search or jump to…</div><button class="btn" onclick="toast('No unresolved alerts')">◉</button><button class="btn primary" onclick="toast('Quick-create menu opened')">＋ Create</button></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const roles={
  Organizer:[['dashboard','⌂','Event overview'],['cfp','▤','CFP & submissions'],['review','◆','Review workspace'],['speakers','♙','Speakers & content'],['crm','◎','Speaker CRM'],['agenda','▦','Agenda'],['comms','✉','Communications'],['public','↗','Public event hub'],['plan','◇','Build readiness']],
  Reviewer:[['reviewer','◆','My review queue'],['guide','?','Evaluation guide']],
  Speaker:[['portal','✓','My speaker portal'],['calendar','▦','Schedule & calendar']],
  Public:[['public','↗','Event hub'],['schedule','▦','Schedule'],['directory','♙','Speakers']],
  Build:[['plan','◇','Readiness'],['architecture','⌘','Architecture'],['dataflow','⇄','Data flow'],['quality','✓','Quality & CI']]
};
let role='Organizer',view='dashboard';
const $=s=>document.querySelector(s);
function renderChrome(){
  $('#roles').innerHTML=Object.keys(roles).map(r=>`<button class="${r===role?'active':''}" onclick="setRole('${r}')">${r}</button>`).join('');
  $('#nav').innerHTML=roles[role].map(([id,icon,label])=>`<button class="${id===view?'active':''}" onclick="setView('${id}')"><i>${icon}</i><span>${label}</span></button>`).join('');
}
function setRole(r){role=r;view=roles[r][0][0];render()} function setView(v){view=v;render()}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const head=(ey,title,sub,action='Export report')=>`<div class="heading"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${sub}</p></div><button class="btn" onclick="toast('${action}')">${action}</button></div>`;
const stat=(label,value,trend)=>`<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="trend">${trend}</div></div>`;
const row=(title,sub,pill,kind='green')=>`<div class="row"><div class="grow"><strong>${title}</strong><small>${sub}</small></div><span class="pill ${kind}">${pill}</span></div>`;
const views={
dashboard:()=>head('Event command center','Event operations overview','An illustrative command center showing how organizers could track the event lifecycle.')+`<div class="grid stats">${stat('CFP submissions','184','Sample event data')}${stat('Review completion','72%','Illustrative progress')}${stat('Confirmed speakers','38','Sample event data')}${stat('Open speaker tasks','17','Illustrative workload')}</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Event lifecycle</h2><span class="link">View operating plan →</span></div><div class="timeline"><div class="stage done">Setup ✓</div><div class="stage now">CFP & review</div><div class="stage">Speakers</div><div class="stage">Agenda</div><div class="stage">Publish</div></div>${row('Finish first review round','40 assigned reviews remain','In progress','gold')}${row('Collect missing speaker headshots','8 profiles need an image','Due Friday','red')}${row('Publish the first agenda draft','23 of 31 sessions are scheduled','Ready soon','blue')}</div><div class="card"><div class="cardhead"><h2>Illustrative activity</h2><span class="link">All activity</span></div>${row('New proposal submitted','A moment ago','New')}${row('Review round reached a milestone','Earlier today','Milestone','blue')}${row('Speaker profile completed','Earlier today','Complete')}${row('Agenda conflict resolved','Yesterday','Resolved')}</div></div>`,
cfp:()=>head('Call for proposals','CFP & submissions','Design the application, publish it, and move every proposal through one clear workflow.','Preview public form')+`<div class="tabs"><button class="active">Submissions 184</button><button>Form builder</button><button>Settings</button><button>Automations</button></div><div class="card"><div class="cardhead"><div><h2>Incoming proposals</h2><span class="label">7 selected · filters: All tracks, Submitted</span></div><button class="btn primary" onclick="toast('Bulk action applied')">Assign reviewers</button></div><table><thead><tr><th>Proposal</th><th>Applicant</th><th>Track</th><th>Submitted</th><th>Status</th></tr></thead><tbody><tr><td><b>AI without the hype</b></td><td>Priya Shah</td><td>Applied AI</td><td>Aug 8</td><td><span class="pill green">Submitted</span></td></tr><tr><td><b>Designing for resilience</b></td><td>Elena Kim</td><td>Product craft</td><td>Aug 8</td><td><span class="pill blue">In review</span></td></tr><tr><td><b>The boring infrastructure wins</b></td><td>Marcus Liu</td><td>Engineering</td><td>Aug 7</td><td><span class="pill gold">Needs reviewer</span></td></tr><tr><td><b>Trust is a product surface</b></td><td>Nadia Rose</td><td>Leadership</td><td>Aug 7</td><td><span class="pill green">Submitted</span></td></tr></tbody></table></div>`,
review:()=>head('Evaluation operations','Review workspace','Build consistent evaluation plans, balance assignments, and monitor decision readiness.','Create review round')+`<div class="grid stats">${stat('Assigned reviews','144','18 reviewers')}${stat('Completed','104','72% complete')}${stat('Conflicts declared','3','All reassigned')}${stat('Decision ready','62','Score threshold met')}</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Round 1 completion</h2><b>72%</b></div><div class="progress"><span style="width:72%"></span></div>${row('Applied AI','31 of 36 reviews','86%')}${row('Product craft','26 of 39 reviews','67%','gold')}${row('Engineering','29 of 41 reviews','71%','blue')}${row('Leadership','18 of 28 reviews','64%','gold')}</div><div class="card"><div class="cardhead"><h2>Evaluation criteria</h2><span class="link">Edit plan</span></div>${row('Relevance','Fit for audience and event theme','30%','blue')}${row('Originality','Distinct perspective or evidence','25%','blue')}${row('Practical value','Clear audience takeaways','30%','blue')}${row('Clarity','Well-structured proposal','15%','blue')}</div></div>`,
speakers:()=>head('People & programming','Speakers & content','Manage profiles, sessions, collaborators, files, tasks, and readiness in one place.','Invite speaker')+`<div class="grid stats">${stat('Speakers','46','38 confirmed')}${stat('Sessions','31','23 scheduled')}${stat('Profiles complete','83%','8 need attention')}${stat('Assets received','71%','13 outstanding')}</div><div class="card"><div class="cardhead"><h2>Speaker readiness</h2><span class="link">Customize columns</span></div><table><thead><tr><th>Speaker</th><th>Session</th><th>Profile</th><th>Tasks</th><th>Status</th></tr></thead><tbody><tr><td><b>Priya Shah</b><br><small>Northstar AI</small></td><td>AI without the hype</td><td>100%</td><td>4 / 4</td><td><span class="pill green">Ready</span></td></tr><tr><td><b>Elena Kim</b><br><small>Independent</small></td><td>Designing for resilience</td><td>80%</td><td>3 / 4</td><td><span class="pill gold">Needs asset</span></td></tr><tr><td><b>Marcus Liu</b><br><small>Orbit Systems</small></td><td>The boring infrastructure wins</td><td>65%</td><td>2 / 4</td><td><span class="pill red">At risk</span></td></tr></tbody></table></div>`,
crm:()=>head('Relationship pipeline','Speaker CRM','Track prospects and outreach before converting the right people into managed event speakers.','Add prospect')+`<div class="kanban"><div class="column"><div class="columnhead">Prospects <span>8</span></div><div class="person"><b>Amara Okafor</b><br><small>Responsible AI · referral</small></div><div class="person"><b>Jon Bell</b><br><small>Developer experience · inbound</small></div></div><div class="column"><div class="columnhead">Contacted <span>5</span></div><div class="person"><b>Sofia Alvarez</b><br><small>Email sent 2 days ago</small></div><div class="person"><b>Reed Thompson</b><br><small>Follow-up due tomorrow</small></div></div><div class="column"><div class="columnhead">In conversation <span>3</span></div><div class="person"><b>Arun Mehta</b><br><small>Considering keynote slot</small></div><div class="person"><b>May Chen</b><br><small>Requested event details</small></div></div><div class="column"><div class="columnhead">Confirmed <span>12</span></div><div class="person"><b>Priya Shah</b><br><small>Converted Aug 7 ✓</small></div><div class="person"><b>Elena Kim</b><br><small>Converted Aug 4 ✓</small></div></div></div>`,
agenda:()=>head('Schedule operations','Agenda','Arrange sessions by time and room, while Greenroom watches for speaker and space conflicts.','Publish draft')+`<div class="card"><div class="cardhead"><div><h2>Thursday, October 14</h2><span class="label">Draft 3 · 23 of 31 sessions scheduled</span></div><div><button class="btn">−</button> <button class="btn">＋</button></div></div><div class="agenda"><div></div><b>Main stage</b><b>Studio A</b><b>Studio B</b><div class="time">9:00 AM</div><div class="session"><strong>Opening keynote</strong><small>Priya Shah · 60 min</small></div><div class="session gold"><strong>Designing for resilience</strong><small>Elena Kim · 45 min</small></div><div class="session blue"><strong>Systems roundtable</strong><small>Panel · 45 min</small></div><div class="time">10:15 AM</div><div class="session blue"><strong>Trust is a product surface</strong><small>Nadia Rose · 45 min</small></div><div class="session"><strong>AI without the hype</strong><small>Priya Shah · 45 min</small></div><div class="session gold"><strong>Boring infrastructure</strong><small>Marcus Liu · 45 min</small></div><div class="time">11:15 AM</div><div class="session gold"><strong>Product craft panel</strong><small>4 speakers · 60 min</small></div><div class="session blue"><strong>Open source clinic</strong><small>Workshop · 60 min</small></div><div class="session"><strong>Leadership at scale</strong><small>Arun Mehta · 45 min</small></div></div></div>`,
comms:()=>head('Audience operations','Communications','Create reusable messages, trigger delivery from lifecycle events, and see every outcome.','New message')+`<div class="grid two"><div class="card"><div class="cardhead"><h2>Automations</h2><span class="link">Manage triggers</span></div>${row('Submission received','Send applicant confirmation immediately','Active')}${row('Proposal accepted','Send decision + speaker portal invitation','Active')}${row('Speaker task reminder','Send 3 days before task due date','Active')}${row('Agenda published','Notify all confirmed speakers','Draft','gold')}</div><div class="card"><div class="cardhead"><h2>Delivery health</h2><span class="pill green">Healthy</span></div><div class="grid three">${stat('Delivered','1,248','98.8%')}${stat('Queued','14','Sending now')}${stat('Failed','3','Retry scheduled')}</div>${row('Speaker task reminder','238 delivered · 2 bounced','Completed')}${row('Reviewer nudge','18 delivered · 1 retry','Completed')}</div></div>`,
reviewer:()=>head('Reviewer workspace','Your review queue','Focus on assigned proposals, declare conflicts, and apply the shared evaluation guide.','Open evaluation guide')+`<div class="grid stats">${stat('Assigned','12','Round 1')}${stat('Completed','8','67% complete')}${stat('Due','Aug 12','3 days left')}${stat('Conflicts','1','Reassigned')}</div><div class="card"><div class="cardhead"><h2>Next proposals</h2><span class="pill blue">Blind review enabled</span></div>${row('Designing for resilience','Product craft · 8 min read','Start review','blue')}${row('The boring infrastructure wins','Engineering · 6 min read','Continue','gold')}${row('Trust is a product surface','Leadership · 5 min read','Start review','blue')}</div>`,
guide:()=>head('Reviewer workspace','Evaluation guide','A shared rubric keeps decisions consistent, explainable, and fair.')+`<div class="grid two"><div class="card"><h2>Scoring rubric</h2><br>${row('5 — Exceptional','Compelling, distinctive, and immediately useful','5')}${row('3 — Solid','Meets the criterion with adequate evidence','3','blue')}${row('1 — Weak','Does not yet establish the criterion','1','red')}</div><div class="card"><h2>Reviewer principles</h2><br>${row('Evaluate the proposal','Do not infer from reputation or identity','Required')}${row('Declare conflicts early','Personal and professional conflicts both apply','Required')}${row('Leave decision-useful notes','Specific evidence beats general impressions','Required')}</div></div>`,
portal:()=>head('Speaker portal','Welcome back, Priya.','Your session is confirmed. Complete the remaining items so the event team can publish your profile.','Contact organizer')+`<div class="grid two"><div class="card"><div class="cardhead"><h2>Your readiness</h2><b>75%</b></div><div class="progress"><span style="width:75%"></span></div><br>${row('Complete speaker profile','Bio, photo, organization','Complete')}${row('Confirm session details','AI without the hype · 45 min','Complete')}${row('Upload presentation deck','PDF or PPTX · max 50 MB','Due Aug 15','gold')}${row('Review recording consent','Read and sign event release','Due Aug 16','gold')}</div><div class="card"><div class="eyebrow">Your session</div><h2 style="font-size:22px;margin:8px 0">AI without the hype</h2><p class="label">Thursday, October 14 · 10:15 AM<br>Main stage · 45 minutes</p><br><span class="pill blue">Applied AI</span><br><br><button class="btn" onclick="toast('Calendar file downloaded')">↓ Add to calendar</button></div></div>`,
calendar:()=>head('Speaker portal','Your schedule','Everything you need on the event day, with downloadable calendar details.')+`<div class="card">${row('8:30 AM · Speaker check-in','Greenroom, level 2','Required')}${row('9:45 AM · Stage preparation','Main stage backstage','15 minutes')}${row('10:15 AM · AI without the hype','Main stage','45 minutes','blue')}${row('12:30 PM · Speaker lunch','Terrace room','Optional','gold')}</div>`,

architecture:()=>head('System design','Architecture','A strict dependency direction preserves local autonomy without letting domains leak into one another.','View architecture spec')+`<div class="card"><div class="flow"><div class="node"><strong>Role-based UI</strong><small>React + Vite</small></div><span class="arrow">→</span><div class="node"><strong>Transport</strong><small>Hono + Zod</small></div><span class="arrow">→</span><div class="node"><strong>Application</strong><small>Use cases + ports</small></div><span class="arrow">→</span><div class="node"><strong>Domain</strong><small>Rules + types</small></div><span class="arrow">←</span><div class="node"><strong>Adapters</strong><small>D1 · R2 · providers</small></div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="layer"><b>Product domains</b><div class="tags"><span>Identity</span><span>Events</span><span>CFP</span><span>Reviewing</span><span>Content</span><span>CRM</span><span>Agenda</span><span>Comms</span><span>Public</span></div></div><div class="layer"><b>Contract rule</b><div>Cross-domain calls use exported application interfaces or declared events. Each table has one owner.</div></div><div class="layer"><b>Dependency rule</b><div>Domain code imports no UI, HTTP, database, Cloudflare, or provider SDK code.</div></div></div><div class="card"><h2>Context routing</h2><br>${row('Root map','Short AGENTS.md links to domain indexes','Entry')}${row('Domain index','Specs, ownership, tests, plans','Route')}${row('Generated graph','Spec ↔ code ↔ tests ↔ plan','Verify')}${row('CI enforcement','No orphaned or stale identifiers','Guard')}</div></div>`,

quality:()=>head('Delivery control plane','Quality & CI','Fast deterministic gates are designed to keep the codebase legible, testable, and safe for parallel agent work.','Open quality plan')+`<div class="grid two"><div class="card"><div class="cardhead"><h2>Pull request gates</h2><span class="pill gold">Verification pending</span></div>${['Docs & context integrity','Biome + Ruff','Type and error policy','Architecture boundaries','OpenAPI drift','Migration replay + seed','Unit + adapter contracts','Worker integration','Reference Playwright journey','Build + artifact validation','Secrets + dependencies'].map(n=>`<div class="check"><div class="checkmark wait">•</div><div><b>${n}</b><div class="label">Configured or planned; clean-run evidence required</div></div></div>`).join('')}</div><div class="card"><div class="cardhead"><h2>Ralph adversarial review</h2><span class="pill gold">Repair in progress</span></div>${row('Blocking findings','Must be resolved before readiness is claimed','Under review','gold')}${row('Major findings','Tracked and repaired with evidence','Under review','gold')}${row('Minor findings','Recorded with owner and rationale','Tracked','blue')}${row('Exit evidence','Clean checkout plus skeptical re-review','Pending','gold')}<br><h3>Exit condition</h3><p class="label">Zero unresolved blockers or majors, reproducible commands, no contradictory source of truth, and a clean follow-up pass. This prototype does not claim that condition has been met.</p></div></div>`
