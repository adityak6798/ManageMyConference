name: SessionBoard evaluator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - name: Run pinned evaluator against an isolated fixture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:sbek
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sessionboard-evaluator-${{ github.run_id }}
          path: .evidence/sbek/runs
          if-no-files-found: error
