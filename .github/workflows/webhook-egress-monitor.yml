name: webhook-egress-monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe trusted webhook egress
        env:
          WEBHOOK_EGRESS_ENDPOINT: ${{ secrets.WEBHOOK_EGRESS_ENDPOINT }}
          WEBHOOK_EGRESS_TOKEN: ${{ secrets.WEBHOOK_EGRESS_TOKEN }}
          WEBHOOK_EGRESS_PROBE_TARGET: ${{ vars.WEBHOOK_EGRESS_PROBE_TARGET }}
        run: node tools/probe-webhook-egress.mjs --monitor
