name: webhook-egress-monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run private-address, timeout, malformed-status, and DNS-rebinding probes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe trusted webhook egress
        env:
          WEBHOOK_EGRESS_ENDPOINT: ${{ vars.WEBHOOK_EGRESS_ENDPOINT }}
          WEBHOOK_EGRESS_TOKEN: ${{ secrets.WEBHOOK_EGRESS_TOKEN }}
          WEBHOOK_EGRESS_PROBE_TARGET: ${{ vars.WEBHOOK_EGRESS_PROBE_TARGET }}
        run: |
          if [ -z "$WEBHOOK_EGRESS_ENDPOINT" ] || [ -z "$WEBHOOK_EGRESS_PROBE_TARGET" ] || [ -z "$WEBHOOK_EGRESS_TOKEN" ]; then
            echo "Webhook egress monitor is not configured; skipping."
            exit 0
          fi
          if [ "${{ inputs.full }}" = "true" ]; then
            node tools/probe-webhook-egress.mjs | tee webhook-egress-probe.json
          else
            node tools/probe-webhook-egress.mjs --monitor | tee webhook-egress-probe.json
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhook-egress-probe-${{ github.run_id }}
          path: webhook-egress-probe.json
          if-no-files-found: ignore
