# Every job here runs exactly one repository gate: `npm run gate:<job name>`.
#
# The gate scripts in the root package.json are the single definition of what the merge
# gate checks, and `npm run check` composes the same scripts, so the local gate and this
# workflow cannot describe two different meanings of "green". `npm run gates:check`
# (inside gate:integrity) fails the build if they drift.
#
# To add a check, edit its gate script — never add a step here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: uv sync --locked
      - run: npm ci
      - run: npm run gate:integrity

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run gate:test-build

  d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run gate:d1

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/api/.wrangler/wrangler.log
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run gate:security
