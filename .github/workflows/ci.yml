# Every job here runs exactly one repository gate: `npm run gate:<job name>`.
#
# The gate scripts in the root package.json are the single definition of what the merge
# gate checks, and `npm run check` composes the same scripts, so the local gate and this
# workflow cannot describe two different meanings of "green". `npm run gates:check`
# (inside gate:integrity) fails the build if they drift.
#
# To add a check, edit its gate script — never add a step here. Environment setup lives in
# ./.github/actions/setup and is shared; the jobs stay separate so each failure is
# independently visible and no job inherits another's build or database state.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: npm run gate:integrity

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run gate:test-build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-record-test-build
          path: .evidence
          # .evidence is a dot-directory, and upload-artifact@v4 skips hidden files by
          # default — silently, with "No files were found", which is how the evidence job
          # first ran against nothing at all.
          include-hidden-files: true
          if-no-files-found: ignore

  d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run gate:d1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-record-d1
          path: .evidence
          # .evidence is a dot-directory, and upload-artifact@v4 skips hidden files by
          # default — silently, with "No files were found", which is how the evidence job
          # first ran against nothing at all.
          include-hidden-files: true
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-record-browser
          path: .evidence
          # .evidence is a dot-directory, and upload-artifact@v4 skips hidden files by
          # default — silently, with "No files were found", which is how the evidence job
          # first ran against nothing at all.
          include-hidden-files: true
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/api/.wrangler/instances/*/wrangler.log
          if-no-files-found: ignore

  # The one job that consumes another's output, and it consumes only run records: read-only
  # JSON stating what each suite did, at which commit. No build output and no database crosses
  # between jobs. It runs last because it can only judge runs that have happened.
  evidence:
    runs-on: ubuntu-latest
    needs: [test-build, d1, browser]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: run-record-*
          path: .evidence
          merge-multiple: true
      - run: npm run gate:evidence

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, which a shallow clone does not have.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup
      - run: npm run gate:security

  # Deployment is a release action, not a seventh definition of "green". It is deliberately
  # downstream of every gate, so a failed or cancelled check prevents the main branch from
  # reaching Cloudflare. tools/check-gate-drift.mjs enforces this shape.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integrity, test-build, d1, browser, evidence, security]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm run deploy:assert-current
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_EGRESS_TOKEN: ${{ secrets.WEBHOOK_EGRESS_TOKEN }}
          WEBHOOK_EGRESS_TOKEN_PREVIOUS: ${{ secrets.WEBHOOK_EGRESS_TOKEN_PREVIOUS }}
          WEBHOOK_WRAPPING_KEYS: ${{ secrets.WEBHOOK_WRAPPING_KEYS }}
