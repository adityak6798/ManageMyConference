name = "project-greenroom-api"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/openapi.json", "/docs"]

[[d1_databases]]
binding = "DB"
database_name = "greenroom-local"
database_id = "local-development"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "greenroom-assets"
