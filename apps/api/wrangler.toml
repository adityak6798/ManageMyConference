name = "project-greenroom-api"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[vars]
# The ORGANIZER of every calendar invitation, when no mail sender is configured.
#
# An iTIP REQUEST must carry an ORGANIZER, and Gmail and Outlook check it corresponds to the
# sending identity — so in a real deployment this is the mail sender and `EMAIL_SENDER` takes
# precedence over it. This default exists for the configurations that send no mail at all: local
# development, CI, Playwright and the demo, where `COMMUNICATIONS_PROVIDERS=fixture` means the
# invitation reaches a deterministic fake rather than a mailbox. Without it the send refuses and
# the organizer's Send button answers 500 in every configuration this repository ships.
#
# `.invalid` is reserved by RFC 2606 and can never resolve, which is the point: a placeholder that
# cannot be mistaken for a real mailbox and cannot receive a reply if one ever escaped.
CALENDAR_ORGANIZER_EMAIL = "organizer@greenroom.invalid"

# This deployment is a demo, and says so in the only place that can enforce it.
#
# `runtimeAuth` (src/index.ts) refuses `DEMO_MODE=true` unless `ENVIRONMENT=development`, and
# refuses to boot at all without either demo mode or `AUTH_EMAIL_ENDPOINT`/`AUTH_EMAIL_TOKEN`.
# Production emailed-code sign-in does exist (`GAP-007` is partially closed), but demo mode turns it
# off by design — `/api/auth/code` answers 404 while `demoMode` is set — and this deployment carries
# no mail bindings, so demo personas are the only way in here. Local development keeps these in a
# gitignored `.dev.vars`; a deployed Worker cannot read that file, so the two non-secret ones live
# here. `SESSION_SECRET` remains a Worker secret and is never written to this file.
#
# The cost, stated plainly: anyone who finds the deployed URL can sign in as an organizer of the
# seeded event. That is acceptable for a demo holding only seed data and is not acceptable for
# anything else. Graduating this deployment is issue #12 — durable logout and revocation, rotation
# and recovery, membership administration, audit events, the provider ADR — after which
# `ENVIRONMENT` becomes `production` and both of these lines are deleted.
ENVIRONMENT = "development"
DEMO_MODE = "true"

# The AI review suggestion port (#110): `fixture`, `live` or `off`.
#
# `fixture` is the adapter's own default, so this line changes nothing today — it is here to make
# the mode a visible, deliberate property of the deployment rather than an implicit one, the way
# `DEMO_MODE` is. This deployment drafts with the deterministic fake: every suggestion is a hash of
# the abstract's text, says so in its own summary, and needs no credential or network.
#
# `live` additionally requires `REVIEW_AI_API_KEY`, which is a Worker **secret** and never written
# here. A `live` mode without it does not fail the deploy and does not take the reviewer's queue
# down; it fails the Draft button and names the missing binding in the Worker log. `off` withdraws
# the assistant entirely. See docs/engineering/review-suggestions.md.
REVIEW_AI_PROVIDER = "fixture"

# The origin the scheduled outbox drain puts into links it sends.
#
# The cron handler has no request to read an origin from, so a link in a schedule confirmation
# comes from here or it comes from nowhere. Non-secret. Must match the deployed hostname; a stale
# value here produces messages whose links resolve to the wrong deployment rather than failing
# visibly.
#
# Local development inherits this, because `.dev.vars` does not set it — so a calendar link in a
# locally generated message points at the deployed demo rather than at localhost. That is cosmetic
# today, since every local provider is a deterministic fake and no message leaves the machine. Set
# `PUBLIC_BASE_URL` in `apps/api/.dev.vars` to override it if you are working on message contents.
PUBLIC_BASE_URL = "https://project-greenroom-api.adityak6798.workers.dev"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/openapi.json", "/docs"]

[[d1_databases]]
binding = "DB"
database_name = "manage-my-conf"
database_id = "5aa5ed70-b4f8-443a-a3a4-f3a4e41cce7b"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "manage-my-conf"
