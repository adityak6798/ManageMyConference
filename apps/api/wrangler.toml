name = "project-greenroom-api"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/openapi.json", "/docs"]

[[d1_databases]]
binding = "DB"
database_name = "manage-my-conf"
database_id = "5aa5ed70-b4f8-443a-a3a4-f3a4e41cce7b"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "manage-my-conf"
